name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Прод работает на PostgreSQL, а быстрый прогон тестов - на SQLite в памяти.
      # Чтобы различия движков не всплывали только на сервере, тот же набор тестов
      # прогоняется ещё раз против настоящей базы (шаг "Test (pytest, PostgreSQL)").
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mytutor
          POSTGRES_PASSWORD: mytutor
          POSTGRES_DB: mytutor_test
        options: >-
          --health-cmd "pg_isready -U mytutor -d mytutor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Configure Poetry to use an in-project venv
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type-check (mypy)
        # Not yet a blocking gate - see task history: the app predates mypy being
        # enforced and has a backlog of pre-existing errors unrelated to any given
        # change. Still runs on every PR for visibility; flip to blocking once the
        # backlog is cleared.
        run: poetry run mypy app
        continue-on-error: true

      - name: Test (pytest, SQLite)
        run: poetry run pytest -q

      - name: Test (pytest, PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://mytutor:mytutor@localhost:5432/mytutor_test
        run: poetry run pytest -q

      - name: Migrations apply to a clean PostgreSQL
        # Тесты поднимают схему через metadata.create_all, а прод - миграциями.
        # Проверяем и этот путь: на сервере выполняется именно он.
        env:
          DATABASE_URL: postgresql+asyncpg://mytutor:mytutor@localhost:5432/mytutor_migrations
        run: |
          PGPASSWORD=mytutor psql -h localhost -U mytutor -d postgres -c "CREATE DATABASE mytutor_migrations"
          poetry run alembic upgrade head
          poetry run alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test

      - name: Build (vue-tsc + vite)
        run: npm run build
