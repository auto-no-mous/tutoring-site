[project]
name = "my-tutor-backend"
version = "0.1.0"
description = "my-tutor.ru backend API"
authors = [{ name = "my-tutor.ru" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.115.0)",
    "uvicorn[standard] (>=0.32.0)",
    "sqlalchemy (>=2.0.36)",
    "alembic (>=1.14.0)",
    "aiosqlite (>=0.20.0)",
    "asyncpg (>=0.30.0)",
    # Синхронный драйвер нужен разовому переносу данных (app.scripts.sqlite_to_postgres):
    # приложение ходит в базу через asyncpg, но операции обслуживания проще делать без
    # асинхронного стека.
    "psycopg[binary] (>=3.2.0)",
    "pydantic (>=2.9.0)",
    "pydantic-settings (>=2.6.0)",
    "python-jose[cryptography] (>=3.3.0)",
    "python-multipart (>=0.0.12)",
    "email-validator (>=2.2.0)",
    "httpx (>=0.27.0)",
    "python-telegram-bot (>=21.6)",
    "jinja2 (>=3.1.4)",
    "aiosmtplib (>=3.0.2)",
    "bcrypt (>=4.2.0)",
    "tzdata (>=2024.2)",
    "gunicorn (>=23.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "sentry-sdk (>=2.66.1,<3.0.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
ruff = ">=0.7.0"
mypy = ">=1.13.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
