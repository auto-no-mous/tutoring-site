server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, а не $proxy_add_x_forwarded_for: nginx здесь - крайний прокси,
        # поэтому реальный клиент это и есть $remote_addr. Добавление к цепочке дало бы
        # клиенту возможность подставить свой X-Forwarded-For первым звеном, а бэкенд
        # (uvicorn с --forwarded-allow-ips=*) берёт из цепочки именно первое - и ключ
        # per-IP лимитера на /auth/* стал бы подконтролен тому, кого он ограничивает.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
