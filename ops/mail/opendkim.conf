# Подпись исходящих писем ключом DKIM. Файл целиком копируется в /etc/opendkim.conf
# скриптом ops/mail/install.sh.

Syslog                  yes
SyslogSuccess           yes
UMask                   007
UserID                  opendkim

# sv = подписывать исходящие и проверять входящие.
Mode                    sv
Canonicalization        relaxed/simple
# From подписывается дважды - это мешает подменить заголовок, добавив второй From.
OversignHeaders         From
SubDomains              no

# Postfix ходит сюда как milter (см. smtpd_milters в install.sh).
Socket                  inet:8891@127.0.0.1
PidFile                 /run/opendkim/opendkim.pid

KeyTable                refile:/etc/opendkim/key.table
SigningTable            refile:/etc/opendkim/signing.table
# Письма из этих сетей считаются своими: их подписываем, а не проверяем.
ExternalIgnoreList      refile:/etc/opendkim/trusted.hosts
InternalHosts           refile:/etc/opendkim/trusted.hosts
