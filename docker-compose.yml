services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in .env so the SQLite file always lives on
      # the named volume below. Point this at a postgresql+asyncpg:// DSN instead when
      # migrating off SQLite (section 9) - drop the override and set it in .env.
      DATABASE_URL: sqlite+aiosqlite:///storage/db.sqlite3
    volumes:
      - backend_storage:/app/storage
    expose:
      - "8000"

  nginx:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  # Long-polling Telegram bot (see README "Telegram-бот"), the /start handler behind
  # the "Подключить Telegram" flow in Settings. Optional and off by default - only
  # meaningful once TELEGRAM_BOT_TOKEN is actually set in backend/.env, so it's
  # gated behind a profile: `docker compose --profile bot up -d` to include it.
  # Without that flag `docker compose up` never starts it, so an unconfigured token
  # can't crash-loop this service.
  bot:
    build: ./backend
    restart: unless-stopped
    profiles: ["bot"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///storage/db.sqlite3
    volumes:
      - backend_storage:/app/storage
    command: ["python", "-m", "app.scripts.run_telegram_bot"]

volumes:
  backend_storage:
